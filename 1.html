<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브 카페 주문서</title>
    <style>
        /* [전체 디자인 및 폰트 설정] */
        body {
            background-color: #faf6f0; /* 베이지 배경 */
            font-family: '맑은 고딕', sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        /* 최대 너비 520px, 가운데 정렬, 둥근 모서리, 부드러운 그림자 */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(107, 66, 38, 0.1);
            box-sizing: border-box;
        }

        /* [페이지 상단] */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header .logo {
            font-size: 50px;
            margin: 0;
            line-height: 1;
        }
        .header h1 {
            color: #6b4226; /* 브라운 */
            font-size: 28px;
            margin: 10px 0 5px 0;
        }
        .header p {
            color: #885a3a;
            font-size: 14px;
            margin: 0;
        }

        /* [입력 폼 스타일링] */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label.title {
            display: block;
            font-weight: bold;
            color: #6b4226;
            margin-bottom: 8px;
        }

        /* 입력칸: 너비 100%, 패딩 10px, 둥근 모서리 8px */
        input[type="text"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* 포커스 시 테두리 갈색 + 연한 갈색 그림자 */
        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #6b4226;
            box-shadow: 0 0 0 3px rgba(107, 66, 38, 0.15);
        }

        /* 라디오/체크박스 가로 배치 */
        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .radio-group label,
        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }
        .radio-group input,
        .checkbox-group input {
            margin-right: 6px;
            accent-color: #6b4226; /* 체크 색상을 갈색으로 */
        }

        /* [예상 금액 영역] */
        .price-display {
            font-size: 24px;
            color: #6b4226;
            font-weight: bold;
            text-align: center;
            margin: 30px 0 20px 0;
            padding-top: 20px;
            border-top: 1px dashed #ddd;
        }

        /* [버튼 스타일링] */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit {
            background-color: #6b4226;
            color: #ffffff;
        }
        .btn-submit:hover {
            background-color: #8a5a36; /* hover 시 약간 밝게 */
        }
        .btn-reset {
            background-color: #e9e3db;
            color: #555;
        }
        .btn-reset:hover {
            background-color: #d8d0c5;
        }

        /* [주문 확인 메시지] */
        .success-message {
            background-color: #e6f4ea; /* 연두색 배경 */
            color: #137333; /* 초록 글씨 */
            padding: 15px;
            border-radius: 8px; /* 둥근 모서리 */
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            display: none; /* 기본은 숨김 */
            line-height: 1.5;
        }
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 헤더 -->
        <div class="header">
            <p class="logo">☕</p>
            <h1>바이브 카페</h1>
            <p>당신의 하루에 바이브를 더하다</p>
        </div>

        <form id="orderForm">
            <!-- 1. 이름 -->
            <div class="form-group">
                <label for="userName" class="title">이름 (필수)</label>
                <input type="text" id="userName" placeholder="주문자 성함을 입력해주세요">
            </div>

            <!-- 2. 전화번호 -->
            <div class="form-group">
                <label for="userPhone" class="title">전화번호</label>
                <input type="tel" id="userPhone" placeholder="010-0000-0000">
            </div>

            <!-- 3. 음료 선택 -->
            <div class="form-group">
                <label for="drink" class="title">음료 선택 (필수)</label>
                <select id="drink">
                    <option value="">음료를 선택해주세요</option>
                    <option value="3500" data-name="아메리카노">아메리카노 3,500원</option>
                    <option value="4000" data-name="카페라떼">카페라떼 4,000원</option>
                    <option value="4500" data-name="카페모카">카페모카 4,500원</option>
                    <option value="4500" data-name="바닐라라떼">바닐라라떼 4,500원</option>
                    <option value="4500" data-name="녹차라떼">녹차라떼 4,500원</option>
                </select>
            </div>

            <!-- 4. 사이즈 -->
            <div class="form-group">
                <label class="title">사이즈</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="size" value="0" data-name="S"> S (+0원)
                    </label>
                    <label>
                        <!-- M사이즈 기본 선택 -->
                        <input type="radio" name="size" value="500" data-name="M" checked> M (+500원)
                    </label>
                    <label>
                        <input type="radio" name="size" value="1000" data-name="L"> L (+1,000원)
                    </label>
                </div>
            </div>

            <!-- 5. 추가 옵션 -->
            <div class="form-group">
                <label class="title">추가 옵션</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="option" value="500" data-name="샷 추가"> 샷 추가 (+500원)
                    </label>
                    <label>
                        <input type="checkbox" name="option" value="500" data-name="크림 추가"> 크림 추가 (+500원)
                    </label>
                    <label>
                        <input type="checkbox" name="option" value="300" data-name="시럽 추가"> 시럽 추가 (+300원)
                    </label>
                    <label>
                        <input type="checkbox" name="option" value="0" data-name="디카페인"> 디카페인 (+0원)
                    </label>
                </div>
            </div>

            <!-- 6. 수량 -->
            <div class="form-group">
                <label for="quantity" class="title">수량</label>
                <input type="number" id="quantity" min="1" max="10" value="1">
            </div>

            <!-- 7. 요청사항 -->
            <div class="form-group">
                <label for="requests" class="title">요청사항</label>
                <textarea id="requests" placeholder="기타 요청사항이 있으시면 적어주세요."></textarea>
            </div>

            <!-- 예상 금액 표시 -->
            <div class="price-display" id="totalPriceDisplay">
                예상 금액: 0원
            </div>

            <!-- 버튼 영역 -->
            <div class="button-group">
                <button type="button" class="btn-submit" id="btnSubmit">주문하기 및 엑셀 저장</button>
                <button type="button" class="btn-reset" id="btnReset">다시 작성</button>
            </div>

            <!-- 8. 주문 확인 메시지 -->
            <div class="success-message" id="successMessage">
                주문이 완료되었습니다!
            </div>
        </form>
    </div>

    <script>
        // 요소들 불러오기
        const form = document.getElementById('orderForm');
        const drinkSelect = document.getElementById('drink');
        const quantityInput = document.getElementById('quantity');
        const totalPriceDisplay = document.getElementById('totalPriceDisplay');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnReset = document.getElementById('btnReset');
        const successMessage = document.getElementById('successMessage');

        // 상태 변수 (금액 계산용)
        let calculatedTotal = 0;

        // [함수] 예상 금액 계산 및 화면 표시
        function updatePrice() {
            let total = 0;

            // 1. 음료 금액
            if (drinkSelect.value) {
                total += parseInt(drinkSelect.value);
            }

            // 2. 사이즈 금액
            const selectedSize = document.querySelector('input[name="size"]:checked');
            if (selectedSize) {
                total += parseInt(selectedSize.value);
            }

            // 3. 추가 옵션 금액
            const checkedOptions = document.querySelectorAll('input[name="option"]:checked');
            checkedOptions.forEach(option => {
                total += parseInt(option.value);
            });

            // 4. 수량 곱하기
            let quantity = parseInt(quantityInput.value);
            // 수량 방어 코드 (비정상 입력 방지)
            if (isNaN(quantity) || quantity < 1) quantity = 1;
            
            total = total * quantity;
            calculatedTotal = total;

            // 화면에 천단위 콤마 표시
            totalPriceDisplay.textContent = `예상 금액: ${total.toLocaleString()}원`;
        }

        // [이벤트 리스너] 폼 안의 내용이 변경될 때마다 updatePrice 실행
        form.addEventListener('input', updatePrice);

        // 초기 화면 설정 (기본값으로 계산)
        updatePrice();

        // [이벤트 리스너] 주문하기 버튼 클릭 시
        btnSubmit.addEventListener('click', function(e) {
            e.preventDefault(); // 기본 폼 제출(새로고침) 방지

            const userName = document.getElementById('userName').value.trim();
            const drinkOption = drinkSelect.options[drinkSelect.selectedIndex];
            
            // 필수 입력값 검증
            if (userName === '') {
                alert('이름을 입력해주세요');
                document.getElementById('userName').focus();
                return;
            }
            if (drinkSelect.value === '') {
                alert('음료를 선택해주세요');
                drinkSelect.focus();
                return;
            }

            // 선택된 데이터 추출을 위한 변수 세팅
            const drinkName = drinkOption.getAttribute('data-name');
            const sizeOption = document.querySelector('input[name="size"]:checked');
            const sizeName = sizeOption ? sizeOption.getAttribute('data-name') : '';
            
            const checkedOptions = document.querySelectorAll('input[name="option"]:checked');
            const optionNames = Array.from(checkedOptions).map(opt => opt.getAttribute('data-name'));
            const optionText = optionNames.length > 0 ? `(${optionNames.join(', ')}) ` : '';
            
            const quantity = quantityInput.value;

            // 1. 성공 메시지 표시
            const successText = `${userName}님, ${drinkName} ${sizeName}사이즈 ${optionText}${quantity}잔, 총 ${calculatedTotal.toLocaleString()}원 주문이 접수되었습니다!`;
            successMessage.textContent = successText;
            successMessage.classList.add('show');

            // 2. 엑셀(CSV) 저장 실행
            downloadCSV();
        });

        // [이벤트 리스너] 다시 작성 버튼 클릭 시
        btnReset.addEventListener('click', function() {
            form.reset(); // 모든 폼 요소 초기화
            successMessage.classList.remove('show'); // 메시지 숨김
            updatePrice(); // 금액 0원으로 재계산
        });

        // [함수] CSV 엑셀 다운로드 로직
        function downloadCSV() {
            // 현재 날짜 및 시간
            const now = new Date();
            const orderDate = now.toLocaleString();
            
            // 파일명에 들어갈 타임스탬프 (예: 20260922_142531)
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timestamp = `${year}${month}${day}_${hours}${minutes}${seconds}`;

            // 폼 데이터 수집
            const userName = document.getElementById('userName').value.trim();
            const userPhone = document.getElementById('userPhone').value.trim();
            const drinkName = drinkSelect.options[drinkSelect.selectedIndex].getAttribute('data-name');
            const sizeName = document.querySelector('input[name="size"]:checked').getAttribute('data-name');
            const optionsArray = Array.from(document.querySelectorAll('input[name="option"]:checked')).map(opt => opt.getAttribute('data-name'));
            const optionsText = optionsArray.join(', ');
            const quantity = quantityInput.value;
            const requests = document.getElementById('requests').value.trim();
            const totalPrice = `${calculatedTotal.toLocaleString()}원`;

            // CSV 데이터 생성 (구분자 콤마)
            // 텍스트 내에 콤마가 있을 수 있으므로 쌍따옴표(")로 값을 감싸줍니다.
            const clean = (str) => `"${String(str).replace(/"/g, '""')}"`;
            
            let csvContent = "주문일시,이름,전화번호,음료,사이즈,추가옵션,수량,요청사항,총금액\n";
            csvContent += `${clean(orderDate)},${clean(userName)},${clean(userPhone)},${clean(drinkName)},${clean(sizeName)},${clean(optionsText)},${clean(quantity)},${clean(requests)},${clean(totalPrice)}\n`;

            // 한글 깨짐 방지용 BOM(\uFEFF)을 포함한 Blob 객체 생성
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            
            // 브라우저에서 다운로드 실행 (문서에 링크 부착 후 클릭하고 바로 제거)
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `바이브카페_주문서_${timestamp}.csv`);
            
            document.body.appendChild(link); // DOM에 추가
            link.click();                    // 다운로드 발생
            document.body.removeChild(link); // DOM에서 제거
            URL.revokeObjectURL(url);        // 메모리 해제
        }
    </script>
</body>
</html>
